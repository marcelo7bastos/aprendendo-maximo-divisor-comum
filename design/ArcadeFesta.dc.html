<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;700;800&display=swap">
  <style>
    body { margin:0; background:#100E24; font-family: Outfit, "Segoe UI", system-ui, sans-serif; }
    a { color:#46E5FF; } a:hover { color:#8FF0FF; }
    .npip{ width:15px; height:15px; border-radius:50%; display:block; }
    .npip.adesivo{ border-radius:0; clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); }
    .npip.biscoito{ border-radius:50%; background-image:
      radial-gradient(circle at 34% 36%, rgba(20,10,0,.5) 0 2px, transparent 2.4px),
      radial-gradient(circle at 68% 62%, rgba(20,10,0,.45) 0 1.8px, transparent 2.2px); }
    .slot{ border:2px solid #3A3170; border-radius:14px; background:#191637; padding:9px 10px 12px; }
    .slot.on{ border-color:#B8FF4A; box-shadow: 0 0 0 1px rgba(184,255,74,.25), 0 0 18px rgba(184,255,74,.18); }
    .slot.off{ border-style:dashed; }
    .dial{ min-width:56px; height:56px; padding:0 14px; border-radius:14px; border:2px solid #3A3170;
      background:#191637; font-family:"Bungee", Outfit, sans-serif; font-size:19px; color:#B3A9E8;
      cursor:pointer; position:relative; transition:transform .12s ease; }
    .dial:hover{ transform:translateY(-2px); border-color:#5B4FA8; }
    .dial.sel{ background:#B8FF4A; border-color:#B8FF4A; color:#141033; box-shadow:0 0 22px rgba(184,255,74,.45); }
    .dial.ok:after, .dial.no:after{ content:""; position:absolute; top:-5px; right:-5px; width:14px; height:14px;
      border-radius:50%; border:2px solid #100E24; }
    .dial.ok:after{ background:#46E5FF; }
    .dial.no:after{ background:#FF4D9D; }
    .go{ height:56px; padding:0 30px; border:0; border-radius:14px; background:#FF4D9D; color:#160B1D;
      font-family:"Bungee", Outfit, sans-serif; font-size:18px; letter-spacing:.02em; cursor:pointer;
      box-shadow:0 0 26px rgba(255,77,157,.45); }
    .go:hover{ transform:translateY(-2px); }
  </style>
</helmet>

<div style="width:1120px;height:900px;background:radial-gradient(900px 480px at 78% -8%, rgba(70,229,255,.14), transparent 60%), radial-gradient(700px 460px at 8% 108%, rgba(255,77,157,.16), transparent 62%), #100E24;padding:24px 28px;display:flex;flex-direction:column;gap:14px;color:#EFEBFF;font-family:Outfit, 'Segoe UI', system-ui, sans-serif;">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
    <div style="display:flex;align-items:center;gap:13px;">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="9.4" width="18" height="11.6" rx="2.4" fill="#FF4D9D"></rect>
        <rect x="2" y="6.2" width="20" height="4.4" rx="1.6" fill="#B8FF4A"></rect>
        <path d="M12 6.4V21" stroke="#100E24" stroke-width="2"></path>
        <path d="M12 6.6C10.4 3.4 6.8 3.6 6.9 5.6 7 7 9.5 6.9 12 6.6Z" fill="#B8FF4A"></path>
        <path d="M12 6.6c1.6-3.2 5.2-3 5.1-1-.1 1.4-2.6 1.3-5.1 1Z" fill="#B8FF4A"></path>
      </svg>
      <div>
        <div style="font-family:'Bungee', Outfit, sans-serif;font-size:22px;line-height:1.1;color:#EFEBFF;">MISSÃO KITS</div>
        <div style="font-size:12px;font-weight:700;color:#8C82CE;letter-spacing:.14em;text-transform:uppercase;margin-top:3px;">Direção B · Arcade da festa</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;">
      <div style="padding:9px 16px;border-radius:12px;background:#191637;border:2px solid #2E2760;text-align:center;">
        <div style="font-size:10px;font-weight:800;color:#8C82CE;letter-spacing:.14em;">TENTATIVAS</div>
        <div style="font-family:'Bungee', Outfit, sans-serif;font-size:20px;color:#46E5FF;line-height:1.2;">{{tentativas}}</div>
      </div>
      <div style="padding:9px 16px;border-radius:12px;background:#191637;border:2px solid #2E2760;text-align:center;">
        <div style="font-size:10px;font-weight:800;color:#8C82CE;letter-spacing:.14em;">RECORDE</div>
        <div style="font-family:'Bungee', Outfit, sans-serif;font-size:20px;color:#B8FF4A;line-height:1.2;">{{recorde}}</div>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:13px;">
    <div style="background:#191637;border:2px solid #2E2760;border-radius:16px;padding:12px 15px;display:flex;align-items:center;gap:12px;">
      <span class="npip maca" style="width:26px;height:26px;background-color:#FF5E5E;box-shadow:0 0 14px rgba(255,94,94,.6)"></span>
      <div style="flex-grow:1;">
        <div style="font-size:11px;font-weight:800;color:#8C82CE;letter-spacing:.14em;">MAÇÃS</div>
        <div style="font-family:'Bungee', Outfit, sans-serif;font-size:26px;color:#FF5E5E;line-height:1.15;">{{estoque.a}}</div>
      </div>
    </div>
    <div style="background:#191637;border:2px solid #2E2760;border-radius:16px;padding:12px 15px;display:flex;align-items:center;gap:12px;">
      <span class="npip biscoito" style="width:26px;height:26px;background-color:#FFB05C;box-shadow:0 0 14px rgba(255,176,92,.55)"></span>
      <div style="flex-grow:1;">
        <div style="font-size:11px;font-weight:800;color:#8C82CE;letter-spacing:.14em;">BISCOITOS</div>
        <div style="font-family:'Bungee', Outfit, sans-serif;font-size:26px;color:#FFB05C;line-height:1.15;">{{estoque.b}}</div>
      </div>
    </div>
    <div style="background:#191637;border:2px solid #2E2760;border-radius:16px;padding:12px 15px;display:flex;align-items:center;gap:12px;">
      <span class="npip adesivo" style="width:28px;height:28px;background-color:#A78BFF"></span>
      <div style="flex-grow:1;">
        <div style="font-size:11px;font-weight:800;color:#8C82CE;letter-spacing:.14em;">ADESIVOS</div>
        <div style="font-family:'Bungee', Outfit, sans-serif;font-size:26px;color:#A78BFF;line-height:1.15;">{{estoque.c}}</div>
      </div>
    </div>
  </div>

  <div style="flex-grow:1;background:#15122F;border:2px solid #2E2760;border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:13px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;">
      <div style="font-family:'Bungee', Outfit, sans-serif;font-size:16px;color:#EFEBFF;letter-spacing:.02em;">{{cabecalho}}</div>
      <div style="font-size:13px;font-weight:700;color:#8C82CE;">{{legenda}}</div>
    </div>
    <div style="display:grid;gap:11px;grid-template-columns:{{gridCols}};">
      <sc-for list="{{slots}}" as="slot" hint-placeholder-count="4">
        <div class="slot {{slot.cls}}">
          <div style="font-size:10px;font-weight:800;color:#8C82CE;letter-spacing:.12em;margin-bottom:8px;">{{slot.titulo}}</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;min-height:50px;">
            <sc-for list="{{slot.pips}}" as="pip" hint-placeholder-count="9">
              <span class="npip {{pip.forma}}" style="background-color:{{pip.cor}};box-shadow:0 0 10px {{pip.brilho}}"></span>
            </sc-for>
            <sc-for list="{{slot.resumos}}" as="res" hint-placeholder-count="1">
              <span style="display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:8px;background:#221D48;font-size:12px;font-weight:800;color:#CFC6FF;">
                <span class="npip {{res.forma}}" style="background-color:{{res.cor}}"></span>{{res.texto}}
              </span>
            </sc-for>
            <sc-if value="{{slot.vazio}}" hint-placeholder-val="{{false}}">
              <span style="font-family:'Bungee', Outfit, sans-serif;font-size:24px;color:#39316E;">?</span>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="background:{{placar.bg}};border:2px solid {{placar.borda}};border-radius:18px;padding:14px 20px;display:flex;align-items:center;gap:20px;min-height:88px;">
    <div style="flex-grow:1;">
      <div style="font-family:'Bungee', Outfit, sans-serif;font-size:24px;color:{{placar.cor}};line-height:1.15;">{{placar.titulo}}</div>
      <div style="font-size:14px;font-weight:600;color:#BFB6F5;margin-top:5px;">{{placar.texto}}</div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;max-width:400px;justify-content:flex-end;align-items:center;">
      <sc-for list="{{sobras}}" as="s" hint-placeholder-count="4">
        <span class="npip {{s.forma}}" style="background-color:{{s.cor}};box-shadow:0 0 12px {{s.brilho}}"></span>
      </sc-for>
    </div>
  </div>

  <div style="display:flex;align-items:flex-end;gap:16px;">
    <div style="flex-grow:1;">
      <div style="font-size:12px;font-weight:800;color:#8C82CE;letter-spacing:.12em;margin-bottom:9px;">ESCOLHA O NÚMERO DE KITS</div>
      <div style="display:flex;flex-wrap:wrap;gap:9px;">
        <sc-for list="{{opcoes}}" as="op" hint-placeholder-count="12">
          <button class="dial {{op.cls}}" onClick="{{op.pick}}">{{op.n}}</button>
        </sc-for>
      </div>
    </div>
    <button class="go" onClick="{{montar}}">{{rotuloBotao}}</button>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"desafio":{"editor":"enum","options":["12 · 18 · 30","8 · 12 · 20","42 · 70 · 98"],"default":"12 · 18 · 30","section":"Desafio"},"$preview":{"width":1120,"height":900}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { kits: 4, montado: 0, tentativas: 0, recorde: 0, tentados: {} };
  }
  numeros(){
    var d = this.props.desafio;
    if (d === "8 · 12 · 20") return [8, 12, 20];
    if (d === "42 · 70 · 98") return [42, 70, 98];
    return [12, 18, 30];
  }
  mdc(a, b){ while (b) { var t = a % b; a = b; b = t; } return a; }
  renderVals(){
    var self = this;
    var nums = this.numeros();
    var itens = [
      { nome: "maçãs", singular: "maçã", forma: "maca", cor: "#FF5E5E", brilho: "rgba(255,94,94,.55)" },
      { nome: "biscoitos", singular: "biscoito", forma: "biscoito", cor: "#FFB05C", brilho: "rgba(255,176,92,.5)" },
      { nome: "adesivos", singular: "adesivo", forma: "adesivo", cor: "#A78BFF", brilho: "rgba(167,139,255,.5)" }
    ];
    var maxKits = Math.min(14, nums[0], nums[1], nums[2]);
    var kits = Math.max(1, Math.min(this.state.kits, maxKits));
    var montado = this.state.montado === kits ? kits : 0;
    var revelado = montado > 0;
    var LIMITE = 10;

    var slots = [];
    for (var k = 0; k < kits; k++) {
      var pips = [];
      var resumos = [];
      if (revelado) {
        for (var i = 0; i < 3; i++) {
          var porKit = Math.floor(nums[i] / kits);
          if (porKit <= LIMITE) {
            for (var p = 0; p < porKit; p++) pips.push({ forma: itens[i].forma, cor: itens[i].cor, brilho: itens[i].brilho });
          } else {
            resumos.push({ forma: itens[i].forma, cor: itens[i].cor, texto: "× " + porKit });
          }
        }
      }
      slots.push({
        titulo: "KIT " + (k + 1),
        cls: revelado ? "on" : "off",
        vazio: !revelado,
        pips: pips,
        resumos: resumos
      });
    }

    var sobras = [];
    var nomesSobra = [];
    var totalSobra = 0;
    for (var j = 0; j < 3; j++) {
      var r = nums[j] % kits;
      totalSobra += r;
      if (r > 0) {
        nomesSobra.push(r + " " + (r === 1 ? itens[j].singular : itens[j].nome));
        if (revelado) {
          var mostrar = Math.min(r, 14);
          for (var q = 0; q < mostrar; q++) sobras.push({ forma: itens[j].forma, cor: itens[j].cor, brilho: itens[j].brilho });
        }
      }
    }

    var ok = totalSobra === 0;
    var g = this.mdc(this.mdc(nums[0], nums[1]), nums[2]);
    var maximo = ok && kits === g;
    var placar;
    if (!revelado) {
      placar = {
        bg: "#191637", borda: "#2E2760", cor: "#8C82CE",
        titulo: "PRONTO PARA MONTAR",
        texto: "Escolha quantos kits quer montar e aperte MONTAR para ver o que acontece com o estoque."
      };
    } else if (maximo) {
      placar = {
        bg: "rgba(184,255,74,.1)", borda: "#B8FF4A", cor: "#B8FF4A",
        titulo: "RECORDE! " + kits + " KITS",
        texto: "Nada sobrou e não existe número maior que funcione. Esse número tem nome: MDC."
      };
    } else if (ok) {
      placar = {
        bg: "rgba(70,229,255,.1)", borda: "#46E5FF", cor: "#46E5FF",
        titulo: "ZEROU A MESA · " + kits + " KITS",
        texto: "Todo o estoque virou kit. Ainda dá para tentar um número maior de kits."
      };
    } else {
      placar = {
        bg: "rgba(255,77,157,.1)", borda: "#FF4D9D", cor: "#FF4D9D",
        titulo: "SOBROU " + totalSobra,
        texto: "Ficou fora dos kits: " + nomesSobra.join(" · ") + "."
      };
    }

    var opcoes = [];
    for (var n = 1; n <= maxKits; n++) {
      (function(valor){
        var marcas = self.state.tentados;
        var cls = "";
        if (valor === kits) cls = "sel";
        else if (marcas[valor] === true) cls = "ok";
        else if (marcas[valor] === false) cls = "no";
        opcoes.push({
          n: valor,
          cls: cls,
          pick: function(){ self.setState({ kits: valor, montado: 0 }); }
        });
      })(n);
    }

    var montar = function(){
      if (self.state.montado === kits) return;
      var novos = Object.assign({}, self.state.tentados);
      novos[kits] = ok;
      self.setState({
        montado: kits,
        tentados: novos,
        tentativas: self.state.tentativas + 1,
        recorde: ok && kits > self.state.recorde ? kits : self.state.recorde
      });
    };

    var partes = [];
    for (var m = 0; m < 3; m++) {
      var pk = Math.floor(nums[m] / kits);
      partes.push(pk + " " + (pk === 1 ? itens[m].singular : itens[m].nome));
    }

    return {
      estoque: { a: nums[0], b: nums[1], c: nums[2] },
      gridCols: "repeat(" + (kits <= 5 ? kits : Math.ceil(kits / 2)) + ", minmax(0, 1fr))",
      slots: slots,
      sobras: sobras,
      placar: placar,
      opcoes: opcoes,
      montar: montar,
      rotuloBotao: revelado ? "DE NOVO" : "MONTAR!",
      cabecalho: revelado ? kits + " KITS MONTADOS" : kits + " KITS AGUARDANDO",
      legenda: revelado ? "cada kit leva " + partes.join(" · ") : "aperte MONTAR para distribuir o estoque",
      tentativas: this.state.tentativas,
      recorde: this.state.recorde
    };
  }
}
</script>
</body>
</html>
